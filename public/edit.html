<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit TV show</title>
</head>
<body>
  <h1>Edit TV show</h1>

  <input id="title" placeholder="Title" /><br /><br />
  <input id="genres" placeholder="Genres (comma-separated)" /><br /><br />
  <input id="status" placeholder="Status" /><br /><br />
  <label for="premiered">Premiere date</label>
  <input id="premiered" type="date" /><br /><br />
  <input id="rating" type="number" min="0" max="10" step="0.1" placeholder="Rating (0-10)" /><br /><br />
  <input id="network" placeholder="Network / streaming service" /><br /><br />
  <input id="image" placeholder="Poster image URL" /><br /><br />
  <input id="url" placeholder="TVmaze URL" /><br /><br />
  <textarea id="summary" placeholder="Summary"></textarea><br /><br />
  <button onclick="saveShow()">Save</button>
  <a href="index.html">Cancel</a>
  <p id="message"></p>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    let originalShow = null;

    async function loadShow() {
      const response = await fetch('/api/shows');
      const shows = await response.json();
      originalShow = shows.find(show => String(show.id) === String(id));
      if (!originalShow) { document.getElementById('message').textContent = 'TV show not found.'; return; }
      document.getElementById('title').value = originalShow.title || '';
      document.getElementById('genres').value = (originalShow.genres || []).join(', ');
      document.getElementById('status').value = originalShow.status || '';
      document.getElementById('premiered').value = originalShow.premiered || '';
      document.getElementById('rating').value = originalShow.rating ?? '';
      document.getElementById('network').value = originalShow.network || '';
      document.getElementById('image').value = originalShow.image || '';
      document.getElementById('url').value = originalShow.url || '';
      const template = document.createElement('template'); template.innerHTML = originalShow.summary || '';
      document.getElementById('summary').value = template.content.textContent.trim();
    }

    async function saveShow() {
      if (!originalShow) return;
      const rating = document.getElementById('rating').value;
      const show = {
        tvmazeId: originalShow.tvmazeId ?? null,
        title: document.getElementById('title').value.trim(),
        genres: document.getElementById('genres').value.split(',').map(x => x.trim()).filter(Boolean),
        status: document.getElementById('status').value.trim() || 'Unknown',
        premiered: document.getElementById('premiered').value,
        rating: rating === '' ? null : Number(rating),
        network: document.getElementById('network').value.trim() || 'Unknown',
        image: document.getElementById('image').value.trim() || null,
        url: document.getElementById('url').value.trim() || null,
        summary: document.getElementById('summary').value.trim()
      };
      try {
        const response = await fetch('/api/shows/' + encodeURIComponent(id), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(show)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not save TV show.');
        window.location.href = 'index.html';
      } catch (error) { document.getElementById('message').textContent = error.message; }
    }
    loadShow().catch(error => document.getElementById('message').textContent = error.message);
  </script>
</body>
</html>
