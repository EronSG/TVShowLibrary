<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>My TV Show Library</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#192538;--line:#304158;--text:#f3f6fb;--muted:#aebbd0;--accent:#f5c451;--blue:#4f8cff;--danger:#ff7777}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    header{padding:28px max(20px,calc((100% - 1100px)/2));background:#0b1220;border-bottom:1px solid var(--line)}header .tag{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}h1{margin:4px 0;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:0;color:var(--muted)}main{max-width:1100px;margin:0 auto;padding:24px 20px 48px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}h2{margin:0 0 14px;font-size:1.25rem}.search-row,.form-row{display:flex;gap:10px;flex-wrap:wrap}input,textarea{font:inherit;color:var(--text);background:#0e1726;border:1px solid var(--line);border-radius:9px;padding:11px 12px;min-width:0}input{flex:1}textarea{width:100%;min-height:110px;resize:vertical}button,.button{font:inherit;font-weight:650;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#211a08;text-decoration:none;display:inline-block}button.secondary{background:#2b3b53;color:var(--text)}button.danger{background:#592d38;color:#ffe3e5}button:disabled{opacity:.55;cursor:wait}.status{color:var(--muted);margin:12px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.card{overflow:hidden;background:#111c2c;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column}.poster{width:100%;height:290px;object-fit:cover;background:#243249}.no-poster{height:150px;display:grid;place-items:center;background:#243249;color:var(--muted)}.card-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{margin:0;font-size:1.08rem}.meta{font-size:.88rem;color:var(--muted);margin:0}.summary{font-size:.9rem;color:#d6deeb}.summary p{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}.actions button,.actions a{font-size:.85rem}.pill{display:inline-block;border:1px solid #485a73;border-radius:99px;padding:2px 8px;color:#dce5f5;font-size:.75rem}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.hidden{display:none!important}.notice{padding:10px 12px;border-radius:9px;background:#26394f;color:#dce9ff;margin:12px 0}.notice.error{background:#4b2932;color:#ffe2e5}dialog{max-width:520px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:22px}dialog::backdrop{background:#000a}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px;color:var(--muted);font-size:.9rem}dialog input,dialog textarea{width:100%}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}.attribution{color:var(--muted);font-size:.82rem;text-align:center;margin-top:24px}.attribution a{color:var(--accent)}@media(max-width:520px){.panel{padding:15px}.poster{height:250px}}
  </style>
</head>
<body>
  <header><div class="tag">Discover · Track · Collect</div><h1>My TV Show Library</h1><p>Search TVmaze and keep your own collection of shows.</p></header>
  <main>
    <section class="panel">
      <h2>Find TV shows</h2>
      <form id="search-form" class="search-row"><input id="search" placeholder="Search by show title, e.g. The Office" aria-label="TV show title" required><button id="search-button" type="submit">Search TVmaze</button></form>
      <p id="search-status" class="status" aria-live="polite">Search TVmaze to find shows to add to your library.</p>
      <div id="results" class="grid" style="margin-top:16px"></div>
    </section>
    <section class="panel">
      <div class="section-head"><h2>My collection</h2><button id="add-manual" class="secondary" type="button">+ Add manually</button></div>
      <p id="library-status" class="status" aria-live="polite"></p>
      <div id="library" class="grid"></div>
    </section>
    <p class="attribution">Show information provided by <a href="https://www.tvmaze.com/" target="_blank" rel="noopener noreferrer">TVmaze</a>.</p>
  </main>

  <dialog id="show-dialog">
    <form id="show-form">
      <h2 id="dialog-title">Add TV show</h2>
      <input id="show-id" type="hidden">
      <input id="tvmaze-id" type="hidden">
      <label>Title<input id="show-title" required maxlength="200"></label>
      <label>Genres (comma-separated)<input id="show-genres" placeholder="Drama, Comedy"></label>
      <label>Status<input id="show-status" placeholder="Running, Ended, In Development"></label>
      <label>Premiere date<input id="show-premiered" type="date"></label>
      <label>Rating (0–10)<input id="show-rating" type="number" min="0" max="10" step="0.1"></label>
      <label>Network / streaming service<input id="show-network"></label>
      <label>Poster URL<input id="show-image" type="url" placeholder="https://..."></label>
      <label>TVmaze URL<input id="show-url" type="url" placeholder="https://www.tvmaze.com/shows/..."></label>
      <label>Summary<textarea id="show-summary" placeholder="Short show description"></textarea></label>
      <div id="dialog-error" class="notice error hidden"></div>
      <div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">Cancel</button><button type="submit">Save show</button></div>
    </form>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    const resultsElement = $('results');
    const libraryElement = $('library');
    const searchStatus = $('search-status');
    const libraryStatus = $('library-status');
    const dialog = $('show-dialog');
    let libraryShows = [];

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function showCard(show, saved) {
      const card = element('article', 'card');
      if (show.image) {
        const img = element('img', 'poster');
        img.src = show.image; img.alt = `${show.title} poster`; img.loading = 'lazy';
        img.onerror = () => { img.replaceWith(element('div', 'no-poster', 'Poster unavailable')); };
        card.appendChild(img);
      } else card.appendChild(element('div', 'no-poster', 'No poster available'));
      const body = element('div', 'card-body');
      body.appendChild(element('h3', '', show.title || 'Untitled show'));
      if (show.status) body.appendChild(element('span', 'pill', show.status));
      const genres = Array.isArray(show.genres) ? show.genres.join(', ') : '';
      body.appendChild(element('p', 'meta', `Genres: ${genres || 'Unknown'}`));
      body.appendChild(element('p', 'meta', `Premiered: ${show.premiered || 'Unknown'}`));
      body.appendChild(element('p', 'meta', `Rating: ${show.rating ?? 'Not rated'} / 10`));
      body.appendChild(element('p', 'meta', `Network: ${show.network || 'Unknown'}`));
      const summary = element('div', 'summary');
      // TVmaze summaries may contain HTML. Parse into a detached template and copy only text,
      // so remote markup/scripts are never inserted into the live page.
      const template = document.createElement('template');
      template.innerHTML = show.summary || 'No summary is available.';
      summary.textContent = (template.content.textContent || '').trim();
      if (summary.textContent.length > 240) summary.textContent = summary.textContent.slice(0, 237) + '…';
      body.appendChild(summary);
      const actions = element('div', 'actions');
      if (show.url) {
        const link = element('a', 'button secondary', 'TVmaze page');
        link.href = show.url; link.target = '_blank'; link.rel = 'noopener noreferrer'; actions.appendChild(link);
      }
      if (!saved) {
        const add = element('button', '', 'Add to collection');
        add.type = 'button'; add.addEventListener('click', () => addShow(show)); actions.appendChild(add);
      } else {
        const edit = element('button', 'secondary', 'Edit');
        edit.type = 'button'; edit.addEventListener('click', () => openEdit(show)); actions.appendChild(edit);
        const remove = element('button', 'danger', 'Remove');
        remove.type = 'button'; remove.addEventListener('click', () => deleteShow(show.id)); actions.appendChild(remove);
      }
      body.appendChild(actions); card.appendChild(body); return card;
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }

    async function loadLibrary() {
      libraryStatus.textContent = 'Loading your collection…';
      try {
        libraryShows = await request('/api/shows');
        libraryElement.replaceChildren();
        if (!libraryShows.length) libraryElement.appendChild(element('div', 'empty', 'Your collection is empty. Search TVmaze and add a show, or add one manually.'));
        else libraryShows.forEach((show) => libraryElement.appendChild(showCard(show, true)));
        libraryStatus.textContent = `${libraryShows.length} show${libraryShows.length === 1 ? '' : 's'} in your collection.`;
      } catch (error) { libraryStatus.textContent = error.message; }
    }

    $('search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = $('search').value.trim();
      if (!query) return;
      $('search-button').disabled = true;
      searchStatus.textContent = 'Searching TVmaze…'; resultsElement.replaceChildren();
      try {
        const shows = await request('/api/lookup?title=' + encodeURIComponent(query));
        if (!shows.length) searchStatus.textContent = 'No matching shows found. Try another title.';
        else {
          searchStatus.textContent = `${shows.length} result${shows.length === 1 ? '' : 's'} found. Add any show to your collection.`;
          shows.forEach((show) => {
            const saved = libraryShows.some((item) => Number(item.tvmazeId) === Number(show.tvmazeId));
            resultsElement.appendChild(showCard(show, saved));
          });
        }
      } catch (error) { searchStatus.textContent = error.message; }
      finally { $('search-button').disabled = false; }
    });

    async function addShow(show) {
      try {
        await request('/api/shows', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(show) });
        searchStatus.textContent = `${show.title} added to your collection.`;
        await loadLibrary();
        // Refresh the result cards so the show is no longer offered as a new addition.
        $('search-form').requestSubmit();
      } catch (error) { searchStatus.textContent = error.message; }
    }

    async function deleteShow(id) {
      const show = libraryShows.find((item) => String(item.id) === String(id));
      if (!show || !confirm(`Remove “${show.title}” from your collection?`)) return;
      try { await request('/api/shows/' + encodeURIComponent(id), { method: 'DELETE' }); await loadLibrary(); }
      catch (error) { libraryStatus.textContent = error.message; }
    }

    function openAdd() {
      $('show-form').reset(); $('show-id').value = ''; $('tvmaze-id').value = '';
      $('dialog-title').textContent = 'Add TV show'; $('dialog-error').classList.add('hidden'); dialog.showModal();
    }
    function openEdit(show) {
      $('show-id').value = show.id; $('tvmaze-id').value = show.tvmazeId ?? '';
      $('show-title').value = show.title || ''; $('show-genres').value = (show.genres || []).join(', ');
      $('show-status').value = show.status || ''; $('show-premiered').value = show.premiered || '';
      $('show-rating').value = show.rating ?? ''; $('show-network').value = show.network || '';
      $('show-image').value = show.image || ''; $('show-url').value = show.url || '';
      const template = document.createElement('template'); template.innerHTML = show.summary || '';
      $('show-summary').value = template.content.textContent.trim();
      $('dialog-title').textContent = 'Edit TV show'; $('dialog-error').classList.add('hidden'); dialog.showModal();
    }
    $('add-manual').addEventListener('click', openAdd);
    $('cancel-dialog').addEventListener('click', () => dialog.close());
    $('show-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = $('show-id').value;
      const ratingValue = $('show-rating').value;
      const payload = {
        tvmazeId: $('tvmaze-id').value || null,
        title: $('show-title').value.trim(),
        genres: $('show-genres').value.split(',').map((item) => item.trim()).filter(Boolean),
        status: $('show-status').value.trim() || 'Unknown',
        premiered: $('show-premiered').value,
        rating: ratingValue === '' ? null : Number(ratingValue),
        network: $('show-network').value.trim() || 'Unknown',
        image: $('show-image').value.trim() || null,
        url: $('show-url').value.trim() || null,
        summary: $('show-summary').value.trim()
      };
      try {
        await request(id ? '/api/shows/' + encodeURIComponent(id) : '/api/shows', {
          method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
        });
        dialog.close(); await loadLibrary();
      } catch (error) { $('dialog-error').textContent = error.message; $('dialog-error').classList.remove('hidden'); }
    });

    loadLibrary();
  </script>
</body>
</html>
